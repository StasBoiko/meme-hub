services:
  postgres:
    image: postgres:16-alpine
    container_name: meme-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: meme_hub_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meme_hub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meme-hub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: meme-hub-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: meme-hub-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  zincsearch:
    image: zinclabs/zincsearch:latest
    container_name: meme-hub-zincsearch
    restart: unless-stopped
    environment:
      ZINC_FIRST_ADMIN_USER: admin
      ZINC_FIRST_ADMIN_PASSWORD: password
    ports:
      - "4080:4080"
    volumes:
      - zincsearch_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meme-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/meme_hub_db?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      SEARCH_URL: "${SEARCH_URL:-http://zincsearch:4080}"
      SEARCH_USER: "${SEARCH_USER:-admin}"
      SEARCH_PASSWORD: "${SEARCH_PASSWORD:-password}"
      ELASTICSEARCH_URL: "${ELASTICSEARCH_URL:-http://zincsearch:4080}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@meme-hub.local}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@meme-hub.local}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-http://localhost:8080/callback}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      zincsearch:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  zincsearch_data:
